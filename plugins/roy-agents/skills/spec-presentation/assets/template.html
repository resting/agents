<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1b1a18;
    --muted: #6b6862;
    --rule: #e3dfd8;
    --accent: #b4472a;
    --measure: 40rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --fg: #ece9e3;
      --muted: #9c978d;
      --rule: #322f2a;
      --accent: #e4805c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 20px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: var(--measure); margin: 0 auto; padding: 0 1.5rem 8rem; }

  header { padding: 20vh 0 10vh; }
  h1 {
    font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1.08;
    letter-spacing: -.02em; font-weight: 600; margin: 0;
    text-wrap: balance;
  }

  section { padding: 5rem 0 0; }
  section + section { border-top: 1px solid var(--rule); margin-top: 5rem; padding-top: 4rem; }
  h2 {
    font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.2; letter-spacing: -.015em;
    font-weight: 600; margin: 0 0 1.5rem; text-wrap: balance;
  }
  p { margin: 0 0 1.4rem; text-wrap: pretty; }
  p:last-child { margin-bottom: 0; }
  strong { font-weight: 600; }

  ul { margin: 0; padding: 0; list-style: none; }
  li {
    position: relative; padding-left: 1.6rem; margin-bottom: 1rem; line-height: 1.5;
  }
  li:last-child { margin-bottom: 0; }
  li::before {
    content: ""; position: absolute; left: .25rem; top: .62em;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  @media print {
    body { background: #fff; color: #000; font-size: 12pt; }
    header { padding: 0 0 2rem; }
    section { break-inside: avoid; padding-top: 2rem; }
  }
</style>
</head>
<body>
<main>

  <header>
    <h1>The change, in one sentence.</h1>
  </header>

  <section>
    <h2>Block heading from the spec</h2>
    <p>One or two short lines.</p>
  </section>

  <section>
    <h2>Block heading from the spec</h2>
    <ul>
      <li>Short point.</li>
      <li>Short point.</li>
    </ul>
  </section>

</main>
</body>
</html>
